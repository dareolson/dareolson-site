  <!-- Global styles: layout, typography, colors, nav -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Frog-specific styles: layer stacking, eye animation, fly cursor -->
  <link rel="stylesheet" href="css/frog.css">
</head>
<body>

  <!-- =============================================
       FLY CURSOR
       Custom SVG so it renders consistently on all
       platforms — no emoji font dependency.
       Wings and body are separate SVG groups so
       wings can animate without distorting the body.
  ============================================= -->
  <div id="fly-cursor">
    <!-- Two overlapping copies of the fly PNG.
         Top half is clipped and static (body/head).
         Bottom half is clipped and flaps (wings). -->
    <img id="fly-top"    src="assets/emoji/fly.png" alt="">
    <img id="fly-bottom" src="assets/emoji/fly.png" alt="">
  </div>

  <!-- =============================================
       NAVIGATION
       Fixed top-right. Links to main sections.
  ============================================= -->
  <nav id="main-nav">
    <a href="pages/builds/index.html">BUILDS</a>
    <a href="pages/work/index.html">FILM</a>
    <a href="pages/writing/index.html">WRITING</a>
    <a href="pages/about.html">ABOUT</a>
    <a href="pages/contact.html">CONTACT</a>
  </nav>

  <!-- =============================================
       HOMEPAGE HERO
       Full-viewport area that holds the frog and
       the site identity text.
  ============================================= -->
  <main id="hero">

    <!-- =============================================
         FROG CHARACTER
         10 SVG layers stacked in the same position.
         Each SVG covers the full viewport but only
         its relevant body part is visible inside it.
         Order matters — layers lower in the list
         appear on top.
    ============================================= -->
    <div id="frog">
      <!-- Static body — body, legs, nose baked into one layer -->
      <img class="frog-layer" id="layer-body"      src="FrogFix/body-static.png" alt="">

      <!-- Mouth — swapped during eat animation -->
      <img class="frog-layer" id="layer-mouth"     src="FrogFix/Mouth-1.png" alt="">

      <!-- Eyeballs — moved by JS to track fly cursor -->
      <img class="frog-layer" id="layer-r-eyeball" src="FrogFix/R-eyeball.png" alt="">
      <img class="frog-layer" id="layer-l-eyeball" src="FrogFix/L-eyeball.png" alt="">

      <!-- Eyelids — on top of eyeballs, swapped during blink -->
      <img class="frog-layer" id="layer-r-eyelid"  src="FrogFix/R-eyelid-1.png" alt="">
      <img class="frog-layer" id="layer-l-eyelid"  src="FrogFix/L-eyelid-1.png" alt="">

      <!-- Tongue wrapper — rotation applied here so src swaps can't reset transformOrigin.
           NOT a frog-layer — no filter here, img handles its own invert. -->
      <div id="tongue-wrapper" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;opacity:0">
        <img id="layer-tongue" src="FrogFix/Tongue-1.png" alt="">
      </div>

    </div>


    <!-- =============================================
         SITE IDENTITY
         Name and title, pinned bottom-left.
    ============================================= -->
    <div id="identity">
      <h1>Dare Olson</h1>
      <p class="roles">Full-stack developer &middot; Interactive builds &middot; Director</p>
      <div class="id-actions">
        <a id="cta" href="pages/builds/index.html">See what I build <span aria-hidden="true">&#8599;</span></a>
        <a id="press-link" href="pages/about.html#press">In the news <span aria-hidden="true">&#8599;</span></a>
      </div>
    </div>

  </main>

  <!-- Frog eye tracking + fly cursor movement -->
  <script src="js/frog.js?v=65"></script>

  <script data-goatcounter="https://dareolson.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>

  <!-- General page behaviour (empty for now) -->
  <script src="js/main.js?v=3"></script>
</body>
